<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>stoy Call - 3 أشخاص بدون سيرفر</title>
<script src="https://unpkg.com/peerjs@1.5.3/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b141a;color:#e9edef;font-family:system-ui}
.header{background:#202c33;padding:12px;text-align:center;position:sticky;top:0;z-index:5}
.header b{color:#00a884;font-size:18px}
.room-info{background:#182229;padding:8px 12px;font-size:13px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.room-info span{color:#00a884;word-break:break-all}
.videos{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;min-height:60vh}
.video-box{background:#111b21;border-radius:12px;overflow:hidden;position:relative;aspect-ratio:16/9;border:1px solid #2a3942}
video{width:100%;height:100%;object-fit:cover}
.label{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.7);padding:3px 8px;border-radius:12px;font-size:11px}
.controls{display:flex;justify-content:center;gap:12px;padding:12px;background:#202c33;position:sticky;bottom:80px}
.cbtn{width:50px;height:50px;border-radius:50%;border:none;font-size:20px;cursor:pointer}
.chat-area{background:#111b21;border-top:1px solid #2a3942;padding:8px;display:flex;flex-direction:column;height:180px}
#messages{flex:1;overflow:auto;font-size:14px;padding:5px}
#messages div{margin:4px 0;padding:6px 10px;background:#202c33;border-radius:8px;width:fit-content;max-width:90%}
.input-row{display:flex;gap:6px;margin-top:6px}
.input-row input{flex:1;padding:10px;border-radius:20px;border:none;background:#2a3942;color:#fff}
.input-row button{padding:10px 18px;border-radius:20px;border:none;background:#00a884;color:#fff;font-weight:bold}
.join{position:fixed;inset:0;background:#0b141a;display:flex;align-items:center;justify-content:center;z-index:20;padding:15px}
.card{background:#202c33;padding:22px;border-radius:16px;width:100%;max-width:380px;text-align:center}
.card input{width:100%;padding:12px;margin:7px 0;border-radius:10px;border:none;background:#2a3942;color:#fff}
.card button{width:100%;padding:12px;background:#00a884;border:none;border-radius:10px;color:#fff;font-weight:bold;margin-top:8px;cursor:pointer}
small{color:#8696a0}
</style>
</head>
<body>

<div class="header"><b>🌙 stoy Call Pro</b> - 3 أشخاص - بدون سيرفر</div>
<div class="room-info">
<div>غرفتك: <span id="roomDisplay">...</span></div>
<div><button onclick="copyInvite()" style="padding:5px 12px;background:#00a884;border:none;border-radius:6px;color:#fff">📋 نسخ رابط الدعوة</button></div>
</div>

<div class="videos">
<div class="video-box"><video id="myVideo" autoplay muted playsinline></video><div class="label">أنت</div></div>
<div class="video-box"><video id="v1" autoplay playsinline></video><div class="label">ضيف 1</div></div>
<div class="video-box"><video id="v2" autoplay playsinline></video><div class="label">ضيف 2</div></div>
</div>

<div class="controls">
<button class="cbtn" id="micBtn" style="background:#2a3942">🎤</button>
<button class="cbtn" id="camBtn" style="background:#2a3942">📷</button>
<button class="cbtn" style="background:#f15c6d" onclick="location.reload()">📞</button>
</div>

<div class="chat-area">
<div id="messages"></div>
<div class="input-row">
<input id="msgInput" placeholder="اكتب رسالة...">
<button onclick="sendMsg()">إرسال</button>
</div>
</div>

<div class="join" id="joinBox">
<div class="card">
<h3 style="margin:0;color:#00a884">ادخل المجلس</h3>
<small>اكتب اسمك ورقم غرفة واحد للثلاثة</small>
<input id="userName" placeholder="اسمك مثلا: رامز">
<input id="roomId" placeholder="اسم الغرفة مثلا: ramez-2026">
<small>ارسل نفس اسم الغرفة للشخصين الثانيين</small>
<button onclick="joinstoy()">دخول الآن</button>
<div style="margin-top:12px">
<small>إذا عندك رابط دعوة افتحه مباشرة بيدخلك تلقائي</small>
</div>
</div>
</div>

<script>
let localStream, peer, myPeerId, roomId, userName;
let peers = {}; // id -> call
let dataConns = {};
const myVideo = document.getElementById('myVideo');
const remoteVideos = [document.getElementById('v1'), document.getElementById('v2')];
const urlParams = new URLSearchParams(window.location.search);

// اذا جاي من رابط دعوة
if(urlParams.get('room')){
  document.getElementById('roomId').value = urlParams.get('room');
}

function getFreeVideo(){
  return remoteVideos.find(v=>!v.srcObject || v.srcObject.getTracks().length===0);
}

async function joinstoy(){
  userName = document.getElementById('userName').value.trim();
  roomId = document.getElementById('roomId').value.trim();
  if(!userName || !roomId) return alert('اكتب اسمك واسم الغرفة');
  
  document.getElementById('joinBox').style.display='none';
  document.getElementById('roomDisplay').innerText = roomId;
  
  localStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
  myVideo.srcObject = localStream;

  // معرفك يكون room + اسم + وقت عشان ما يتكرر
  myPeerId = roomId + '-' + userName.replace(/\s/g,'') + '-' + Math.floor(Math.random()*9999);
  peer = new Peer(myPeerId);

  peer.on('open', id=>{
    // حاول تتصل بالاثنين الموجودين قبلك
    // الخدعة: نفترض ان معرفاتهم تبدأ بنفس اسم الغرفة
    // لذلك نحاول نكتشفهم عبر محاولة اتصال
    addMsg('النظام','تم دخولك، ارسل رابط الدعوة للاثنين: '+window.location.origin+window.location.pathname+'?room='+roomId);
    // استمع لاتصالات جديدة
  });

  peer.on('call', async call=>{
    await call.answer(localStream);
    call.on('stream', stream=>{
      let v = getFreeVideo();
      if(v) v.srcObject = stream;
    });
    peers[call.peer]=call;
  });

  peer.on('connection', conn=>{
    conn.on('data', data=>{
      addMsg(data.name, data.msg);
    });
    dataConns[conn.peer]=conn;
    conn.on('open', ()=>{
      addMsg('النظام','انضم '+conn.peer+' للمجلس');
    });
  });

  // زر محاولة اتصال يدوي بالاسم - عشان بدون سيرفر لازم تعرف معرف الشخص
  // الحل: نخلي المستخدم يدخل معرفات الثانيين
  setTimeout(()=>{
    let other1 = prompt('إذا تبي تتصل بشخص موجود، اكتب معرفه (مثلا: ramez-2026-احمد-1234) أو اتركه فاضي وانتظرهم يتصلون بك:','');
    if(other1) connectToPeer(other1);
    let other2 = prompt('معرف الشخص الثالث (اختياري):','');
    if(other2) connectToPeer(other2);
  }, 1000);
}

async function connectToPeer(peerId){
  if(peers[peerId]) return;
  const call = peer.call(peerId, localStream);
  call.on('stream', stream=>{
    let v = getFreeVideo();
    if(v) v.srcObject = stream;
  });
  peers[peerId]=call;
  
  const conn = peer.connect(peerId);
  conn.on('open', ()=>{
    conn.send({name: userName, msg: 'انضممت للمجلس'});
  });
  dataConns[peerId]=conn;
}

function sendMsg(){
  let input = document.getElementById('msgInput');
  let msg = input.value.trim();
  if(!msg) return;
  addMsg('أنت ('+userName+')', msg);
  Object.values(dataConns).forEach(c=>{
    if(c.open) c.send({name:userName, msg:msg});
  });
  input.value='';
}

function addMsg(name, msg){
  let box = document.getElementById('messages');
  box.innerHTML += `<div><b style="color:#00a884">${name}:</b> ${msg}</div>`;
  box.scrollTop = box.scrollHeight;
}

function copyInvite(){
  let link = window.location.origin + window.location.pathname + '?room=' + roomId;
  navigator.clipboard.writeText(link);
  alert('تم نسخ رابط الدعوة:\n'+link);
}

document.getElementById('micBtn').onclick = function(){
  let t = localStream.getAudioTracks()[0];
  t.enabled = !t.enabled;
  this.style.background = t.enabled ? '#2a3942' : '#f15c6d';
  this.innerText = t.enabled ? '🎤' : '🔇';
}
document.getElementById('camBtn').onclick = function(){
  let t = localStream.getVideoTracks()[0];
  t.enabled = !t.enabled;
  this.style.background = t.enabled ? '#2a3942' : '#f15c6d';
  this.innerText = t.enabled ? '📷' : '📵';
}
</script>
</body>
</html>
